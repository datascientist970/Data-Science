<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS & Font -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to right, #f4f6f9, #eef1f5);
        }

        .chat-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .form-control {
            border-radius: 30px 0 0 30px;
            padding-left: 20px;
        }

        .btn-primary {
            border-radius: 0 30px 30px 0;
            padding: 0 25px;
        }

        .card {
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        #loading p {
            margin-top: 10px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="chat-container">
        <h2 class="text-center mb-4 fw-bold text-primary">Ask the AI Assistant</h2>

        <form id="agent-form" class="mb-4">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="prompt" id="prompt-input" class="form-control" placeholder="Type your question..." required>
                <button type="submit" class="btn btn-primary">Ask</button>
            </div>
        </form>

        <div id="loading" class="text-center text-muted" style="display: none;">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Thinking...</p>
        </div>

        <div id="response-box" style="display:none;">
            <div class="card border-start border-4 border-primary">
                <div class="card-body">
                    <h5 class="card-title text-primary">Response</h5>
                    <p id="response-text" class="card-text"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        $('#agent-form').submit(function (e) {
            e.preventDefault();
            let prompt = $('#prompt-input').val();
            let csrfToken = $('[name=csrfmiddlewaretoken]').val();

            $('#response-box').hide();
            $('#loading').show();

            $.ajax({
                type: "POST",
                url: "{% url 'agent' %}",
                data: {
                    'prompt': prompt,
                    'csrfmiddlewaretoken': csrfToken,
                },
                success: function (data) {
                    $('#loading').hide();
                    $('#response-text').text(data.response);
                    $('#response-box').fadeIn();
                },
                error: function () {
                    $('#loading').hide();
                    $('#response-text').text("An error occurred.");
                    $('#response-box').fadeIn();
                }
            });
        });
    });
</script>

</body>
</html>
