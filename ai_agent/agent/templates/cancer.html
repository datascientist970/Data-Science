<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 500;
        }
        .btn-submit {
            background-color: #dc3545;
            border: none;
            padding: 10px 25px;
            font-weight: 500;
        }
        .btn-submit:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Heart Disease Risk Assessment</h4>
                    </div>
                    <div class="card-body">
                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <form method="POST">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="age" class="form-label">Age</label>
                                    <input type="number" class="form-control" id="age" name="age" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="sex" class="form-label">Sex (0=Female, 1=Male)</label>
                                    <select class="form-select" id="sex" name="sex" required>
                                        <option value="0">Female</option>
                                        <option value="1">Male</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="cp" class="form-label">Chest Pain Type (0-3)</label>
                                    <input type="number" class="form-control" id="cp" name="cp" min="0" max="3" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="trestbps" class="form-label">Resting Blood Pressure (mm Hg)</label>
                                    <input type="number" class="form-control" id="trestbps" name="trestbps" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="chol" class="form-label">Cholesterol (mg/dl)</label>
                                    <input type="number" class="form-control" id="chol" name="chol" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="fbs" class="form-label">Fasting Blood Sugar > 120 mg/dl (0=No, 1=Yes)</label>
                                    <select class="form-select" id="fbs" name="fbs" required>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="restecg" class="form-label">Resting ECG (0-2)</label>
                                    <input type="number" class="form-control" id="restecg" name="restecg" min="0" max="2" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="thalach" class="form-label">Maximum Heart Rate Achieved</label>
                                    <input type="number" class="form-control" id="thalach" name="thalach" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="exang" class="form-label">Exercise Induced Angina (0=No, 1=Yes)</label>
                                    <select class="form-select" id="exang" name="exang" required>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="oldpeak" class="form-label">ST Depression Induced by Exercise</label>
                                    <input type="number" step="0.1" class="form-control" id="oldpeak" name="oldpeak" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="slope" class="form-label">Slope of Peak Exercise ST Segment (0-2)</label>
                                    <input type="number" class="form-control" id="slope" name="slope" min="0" max="2" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="ca" class="form-label">Number of Major Vessels (0-3)</label>
                                    <input type="number" class="form-control" id="ca" name="ca" min="0" max="3" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="thal" class="form-label">Thalassemia (0-3)</label>
                                    <input type="number" class="form-control" id="thal" name="thal" min="0" max="3" required>
                                </div>
                            </div>
                            <div class="mt-4 text-center">
                                <button type="submit" class="btn btn-submit text-white">Predict Risk</button>
                                <a href="{% url 'home' %}" class="btn btn-outline-secondary ms-2">Back to Dashboard</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
